# PERFECT FORESIGHT BOUNDING EXPERIMENT - NOT AN OPERATIONAL FORECAST.
# Weather is ERA5 reanalysis for the delivery hour, which no forecaster holds
# at the 10:00 issuance. Results bound what weather could contribute if
# forecasts were exact. Never quote these as day-ahead forecast accuracy.
data:
  target_column: spread
  timestamp_column: timestamp
  input_format: parquet
dates:
  start_date: '2022-01-01'
  end_date: '2025-12-31'
features:
  lag_hours:
  - 48
  - 168
  rolling_window_hours:
  - 24
  rolling_shift_hours: 48
  calendar_timezone: Europe/Berlin
  calendar_features:
  - hour
  - day_of_week
  - month
  - is_weekend
  weather_columns:
  - temperature_2m_c_de_mean
  - wind_speed_10m_m_s_de_weighted
  - wind_speed_100m_m_s_de_weighted
  - shortwave_radiation_w_m2_de_weighted
  - temperature_2m_c_fr_mean
  - wind_speed_10m_m_s_fr_weighted
  - wind_speed_100m_m_s_fr_weighted
  - shortwave_radiation_w_m2_fr_weighted
  grid_columns: []
  perfect_foresight_weather: true
model:
  type: xgboost
  target_column: spread
backtest:
  mode: day_ahead
  issue_hour: 10
  issue_timezone: Europe/Berlin
  evaluation_start_date: '2024-01-01'
  evaluation_end_date: '2024-12-31'
  train_window_days: 90
  validation_window_days: 7
  forecast_horizon_hours: 24
  feature_columns:
  - spread_lag_48
  - spread_lag_168
  - price_de_lag_48
  - price_de_lag_168
  - price_fr_lag_48
  - price_fr_lag_168
  - spread_rolling_mean_24
  - spread_rolling_std_24
  - price_de_rolling_mean_24
  - price_de_rolling_std_24
  - price_fr_rolling_mean_24
  - price_fr_rolling_std_24
  - hour
  - day_of_week
  - month
  - is_weekend
  - temperature_2m_c_de_mean
  - wind_speed_10m_m_s_de_weighted
  - wind_speed_100m_m_s_de_weighted
  - shortwave_radiation_w_m2_de_weighted
  - temperature_2m_c_fr_mean
  - wind_speed_10m_m_s_fr_weighted
  - wind_speed_100m_m_s_fr_weighted
  - shortwave_radiation_w_m2_fr_weighted
retraining:
  strategy: no_retraining
  actual_availability_lag_hours: 1
evaluation:
  metrics:
  - rmse
  - mae
artifacts:
  run_prefix: run
  output_format: parquet
