data:
  target_column: spread
  timestamp_column: timestamp
  input_format: csv
  cleaning:
    duplicate_policy: raise
    required_missing_policy: raise
dates:
  start_date: "2023-01-01"
  end_date: "2023-01-08"
features:
  lag_hours: [1, 24]
  rolling_window_hours: [24]
  calendar_features: [hour, day_of_week, month, is_weekend, is_holiday]
  holiday_dates: ["2023-01-01"]
  weather_columns: [temperature_2m_c, wind_speed_10m_m_s, shortwave_radiation_w_m2]
  # Grid load/generation ingestion is optional; requested columns that are
  # unavailable warn and are excluded from the feature set.
  grid_columns: []
model:
  type: xgboost
  target_column: spread
backtest:
  train_window_days: 3
  forecast_horizon_hours: 24
retraining:
  strategy: fixed_schedule
  fixed_schedule_interval_days: 7
  rolling_rmse_window_days: 7
  rolling_rmse_threshold: 10.0
evaluation:
  metrics: [rmse, mae]
artifacts:
  run_prefix: run
  output_format: parquet
