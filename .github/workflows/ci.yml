name: CI

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project and test dependencies
        run: uv sync --extra test --locked

      - name: Run fixture-based tests
        run: uv run pytest -q -m "not external_api and not aws and not slow"
