name: Publish images

# Builds the forecast Lambda and dashboard images after CI passes on main and
# pushes them to ECR as build-<sha>. Rolling an image out to Lambda or ECS is a
# separate, reviewed `terraform apply` with that tag; this workflow never
# changes running infrastructure.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-images
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: forecast
            dockerfile: deploy/lambda/Dockerfile
          - image: dashboard
            dockerfile: deploy/dashboard/Dockerfile
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image tag
        id: meta
        run: |
          sha=$(git rev-parse HEAD)
          echo "tag=build-${sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "repository=energy-trading-pipeline-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Assume the image publisher role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_PUBLISHER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Skip tags that already exist
        id: exists
        run: |
          if aws ecr describe-images --repository-name "${{ steps.meta.outputs.repository }}" \
               --image-ids imageTag="${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.meta.outputs.repository }}:${{ steps.meta.outputs.tag }} already exists; skipping."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.exists.outputs.found == 'false'
        uses: docker/setup-buildx-action@v3

      # Lambda rejects OCI image indexes, so provenance and SBOM attestations
      # stay off and the push is a single linux/amd64 manifest.
      - name: Build and push
        if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ steps.meta.outputs.repository }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Summarize
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo "Image: \`${{ steps.meta.outputs.repository }}:${{ steps.meta.outputs.tag }}\`"
            echo
            echo "Roll out locally after review:"
            echo "\`${{ matrix.image }}\` → set \`${{ matrix.image == 'forecast' && 'lambda_image_tag' || 'dashboard_image_tag' }} = \"${{ steps.meta.outputs.tag }}\"\` in terraform.tfvars, then plan and apply."
          } >> "$GITHUB_STEP_SUMMARY"
