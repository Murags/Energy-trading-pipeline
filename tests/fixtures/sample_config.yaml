data:
  price_de_path: tests/fixtures/sample_prices_de.csv
  price_fr_path: tests/fixtures/sample_prices_fr.csv
  weather_path: tests/fixtures/sample_weather.csv
dates:
  start_date: "2023-01-01"
  end_date: "2023-01-08"
features:
  lag_hours: [1, 24]
  rolling_window_hours: [24]
model:
  type: xgboost
  target_column: spread
backtest:
  train_window_days: 3
  forecast_horizon_hours: 24
retraining:
  strategy: fixed_schedule
  fixed_schedule_interval_days: 7
  rolling_rmse_window_days: 7
  rolling_rmse_threshold: 10.0
evaluation:
  metrics: [rmse, mae]
artifacts:
  run_prefix: run
  output_format: parquet
