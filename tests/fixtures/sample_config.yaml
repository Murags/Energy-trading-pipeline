data:
  price_de_path: tests/fixtures/sample_prices_de.csv
  price_fr_path: tests/fixtures/sample_prices_fr.csv
  weather_path: tests/fixtures/sample_weather.csv
dates:
  start_date: "2023-01-01"
  end_date: "2023-01-08"
features:
  lag_hours: [1, 24]
  rolling_window_hours: [24]
  calendar_features: [hour, day_of_week, month, is_weekend, is_holiday]
  holiday_dates: ["2023-01-01"]
  weather_columns: [temperature_2m_c, wind_speed_10m_m_s, shortwave_radiation_w_m2]
  grid_columns: [load_de]
model:
  type: xgboost
  target_column: spread
backtest:
  train_window_days: 3
  forecast_horizon_hours: 24
retraining:
  strategy: fixed_schedule
  fixed_schedule_interval_days: 7
  rolling_rmse_window_days: 7
  rolling_rmse_threshold: 10.0
evaluation:
  metrics: [rmse, mae]
artifacts:
  run_prefix: run
  output_format: parquet
