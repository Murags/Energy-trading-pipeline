[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-trading-pipeline"
version = "0.1.0"
description = "Local-first German-French energy spread forecasting and backtesting pipeline."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.32",
]
test = [
    "pytest>=8.0",
]
aws = [
    "boto3>=1.34",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = '--strict-markers -m "not external_api and not aws and not slow"'
markers = [
    "external_api: calls a live external API; may require credentials and network access",
    "aws: accesses live AWS resources; requires credentials and may incur charges",
    "slow: runs long computations or full historical backtests",
]
